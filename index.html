<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jb Yashvi is a senior product designer focused on supply chain and operational products, designing clear experiences for complex, multi-role workflows." />
    <meta name="theme-color" content="#ffffff" />
    <!-- Theme: light unless the visitor chose dark with the toggle (saved on this device). Set
         before first paint (so before the stylesheets) to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        var t
        try { t = localStorage.getItem('jb-theme') } catch (e) {}
        if (t !== 'dark') t = 'light'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#111216' : '#ffffff'
      })()
    </script>
    <!-- Branded intro: only on the first homepage load in this tab session, never with a
         #hash, on another page, after a reload or with reduced motion. Decided before first
         paint (so it sits before the stylesheets); if the app never mounts, the failsafe
         ends the intro state. -->
    <style>html.has-intro:not(.intro-done) { background: #07377b; } html[data-theme="dark"].has-intro:not(.intro-done) { background: #111216; }</style>
    <script>
      (function () {
        try {
          var seen = sessionStorage.getItem('jb-intro')
          sessionStorage.setItem('jb-intro', '1')
          if (seen || location.pathname !== '/' || location.hash) return
          if (!window.matchMedia || matchMedia('(prefers-reduced-motion: reduce)').matches) return
          var root = document.documentElement
          root.classList.add('has-intro')
          window.__introFailsafe = setTimeout(function () { root.classList.add('intro-done') }, 2500)
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet" />
    <title>Jb Yashvi, Senior Product Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
